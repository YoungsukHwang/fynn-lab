[project]
name = "fynn-lab"
version = "0.1.0"
description = "Before/after re-implementation of a skill-based credit coach, plus its regression evals"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15",
    "fastapi>=0.150",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2>=2.15"]

[project.scripts]
fynn-chat = "fynn.chat:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fynn*", "api*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
