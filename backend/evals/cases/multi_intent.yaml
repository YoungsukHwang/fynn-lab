# mi-013 to mi-036 each need a second domain: their labeled skills span two or more Before domains, and
# every question beyond the Before router's likely pick hinges on a fact found only in that topic skill.
# Facts are single claims; the comment above each one names where it comes from.
# mi-016, mi-020, mi-028 and mi-036 need four topic skills, one more than the After bot's cap of 3.

- id: mi-013
  dataset: multi_intent
  persona: rebuilder
  message: "how long is that 30 day late on my store card gonna keep dragging my score down?? also I pay my phone, electric and netflix on time every month, can any of that get reported to help me out"
  intents: 2
  skills: [payment-history, bill-reporting]
  expected_facts:
    # skill:payment-history ("A late payment can stay on reports for up to 7 years from the original delinquency date.") + persona:credit.negative_items[...
    - "Says the Retail store card late can stay on reports up to 7 years from its original delinquency on 2026-08-25, so until about August 2033"
    # skill:payment-history ("Its impact is largest while recent and fades as it ages and on-time payments build up.")
    - "Says the late's impact is largest while it is recent and fades as it ages and on-time payments build up"
    # skill:bill-reporting ("On-time utility, phone, and internet bill payments found in the user's linked bank account are reported to Equifax. They are...
    - "Says on-time phone and electric payments can be reported through the app's Bill Reporting, but only to Equifax"
    # skill:bill-reporting (Do not: "Claim bill types beyond utility, phone, and internet (for example streaming or insurance) are reported.")
    - "Says Netflix would not be reported, since streaming bills are not among the utility, phone and internet bills the feature covers"
    # skill:bill-reporting (Do not: "Claim bill reporting removes or offsets late payments, collections, or other negative items.")
    - "Does not claim that reported bills would offset or remove the store card late payment"
  must_not_regex:
    - '\bI guarantee\b'
    - '(?m)(?:^|(?<=[.!?,;:])\s+)(?:(?!\b(?:no|not|never|nobody|none|cannot|can\W?t|won\W?t|don\W?t|doesn\W?t|isn\W?t|aren\W?t|couldn\W?t|wouldn\W?t|shouldn\W?t|impossible|unclear|unknown|guarantee[sd]?|promise[sd]?|predict|whether|says?|said|tells?|told|claims?|knows?|sure|certain)\b)(?:[^.!?\n,;:]|[,;:](?!\s)))*?\b(?:you\W?ll|you will|your score will|it will|it\W?ll) (?:gain|get back|go up|rise|increase|recover|bounce back)(?: by)? (?:about |around |roughly |up to |at least )?\d+(?:\s*(?:-|to|–)\s*\d+)?\s*points\b'

