    # skill:rent-reporting ("Up to 12 months of past rent can be added for a one-time $25 fee.")
    - "Says adding past rent costs a one-time $25 fee"
    # skill:rent-reporting ("Frame past rent as added positive history, not a guaranteed score change.")
