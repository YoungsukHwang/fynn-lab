# Written blind to every eval result; see README.md in this directory. Each fact cites its source.

- id: mi-101
  dataset: multi_intent
  persona: rebuilder
  message: "Once my secured card finally shows up, can I start using it right away? Also, if I turn on rent reporting, can the rent I already paid earlier this year count too, or only months after I sign up?"
