# Deploys the API to a Hugging Face Docker Space on pushes to main that touch it. Needs the repository
# variable HF_SPACE (for example YoungsukHwang/fynn-lab-api) and the secret HF_TOKEN (a write token);
# without HF_SPACE the job is skipped.
name: Deploy API

on:
  push:
    branches: [main]
    paths: [backend/**, skills/**, personas/**, space/**, .github/workflows/space.yml]
  workflow_dispatch:

jobs:
  sync:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the Space
        run: |
          mkdir -p "$RUNNER_TEMP/space"
          cp space/Dockerfile space/README.md "$RUNNER_TEMP/space/"
          cp -r skills personas "$RUNNER_TEMP/space/"
          rsync -a --exclude tests --exclude '.env*' --exclude '__pycache__' backend/ "$RUNNER_TEMP/space/backend/"
      - name: Push to the Space
        working-directory: ${{ runner.temp }}/space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push -q --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
