id: s4
title: Closed-account reporting time in the Credit Builder skill
kind: body
skill: credit-builder-account
change: >-
  Replaces the pointer "(how long: see score-changes)" in credit-builder-account with the line
  itself: a closed account in good standing can stay on the report for up to 10 years.
motivation: >-
  In the 2026-10-22 run of 64 cases, three After failures (mi-016, mi-019, mi-034) asked whether
  a closed or finished Credit Builder account stays on the report. The answer lives only in the
  score-changes body. The router reasonably picked credit-builder-account, which only pointed to
  score-changes, so the agent could not state the 10 years. This fixes the gap in the skill the
  router already picks.
hypothesis:
  expected: improve
  detail: >-
    Only the body changed, so only cases labeled credit-builder-account or routed to it in the
    baseline rerun. The cases that ask whether a closed or finished Credit Builder account stays
    on the report (mi-016, mi-019, mi-034) should now state the 10-year rule, so some of them
    improve. The new line adds no instruction, so other Credit Builder cases should hold.
    Expected verdict: no regressions, safe to ship.
