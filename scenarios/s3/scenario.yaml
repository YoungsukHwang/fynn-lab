id: s3
title: Route score-drop questions to utilization too
kind: description
skill: utilization
change: >-
  Widens the utilization description so the router also picks it for "why did my score drop"
  questions, since a higher reported balance is a common cause of a drop.
motivation: >-
  Tries to fix the same gap as s1 through routing instead of the score-changes body: if
  utilization is loaded next to score-changes, the answer can compute per-card ratios from the
  utilization guidance.
hypothesis:
  expected: tradeoff
  detail: >-
    A description edit can change routing for any message, so every case reruns. Single
    score-drop questions should improve, because utilization now loads with score-changes. In
    three-part messages that include a score question, the router now wants four skills but can
    pick at most three, so another skill (for example secured-card or marketplace-offers) can
    be pushed out and that part of the answer loses its facts. Expected: some improvements and
    some regressions, a tradeoff rather than a clean ship.
shipped: "2026-10-23"
