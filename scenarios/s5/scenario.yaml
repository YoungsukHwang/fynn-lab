id: s5
title: Route free-report and recovery questions to payment history
kind: description
skill: payment-history
change: >-
  Widens the payment-history description so the router also picks it when the user asks how to
  get free credit reports, or whether or when a score will recover or reach a target.
motivation: >-
  In the 2026-10-22 run, the free-reports line sits in the payment-history body but its
  description never mentions credit reports, so the After router judged that no skill covered
  "is there a free way to look at my credit reports" (mi-024). In sb-001, a "back above 600 by
  December" question, the router left payment-history out, so the reply could not say how the
  recent late fades.
hypothesis:
  expected: improve
  detail: >-
    A description edit can change routing for any message, so every case reruns. mi-024 and
    sb-001 should improve once payment-history loads. Recovery questions inside three-part
    messages could now take a slot from another skill, but the new triggers are narrow, so few
    cases should lose a skill. Expected: improvements and no regressions, or at most one.
